# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-renesas-bsp"
BBFILE_PATTERN_meta-renesas-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-renesas-bsp = "20"

LAYERDEPENDS_meta-renesas-bsp = "core meta-rz-bsp meta-rz-boards"
LAYERSERIES_COMPAT_meta-renesas-bsp = "scarthgap"

